<!doctype html>
<html><head><meta charset="utf-8"><title>Transparent VRM Character (Python)</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,sans-serif;color:white;user-select:none;}
#hud{position:absolute;top:5px;left:5px;background:rgba(0,0,0,0.4);padding:2px 6px;border-radius:4px;font-size:11px;pointer-events:none;opacity:0.6;}
#close{position:absolute;top:5px;right:5px;width:18px;height:18px;background:rgba(200,50,50,0.4);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:100;}
#close:hover{background:rgba(255,50,50,0.8);}
#vrmaMenu{position:absolute;display:none;min-width:128px;max-height:min(360px,calc(100vh - 12px));overflow-y:auto;padding:4px;background:rgba(20,20,24,0.92);border:1px solid rgba(255,255,255,0.18);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.35);z-index:150;backdrop-filter:blur(8px);}
#vrmaMenu.open{display:block;}
#vrmaMenu button{display:block;width:100%;height:30px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:white;text-align:left;font:12px Segoe UI,sans-serif;cursor:pointer;}
#vrmaMenu button:hover{background:rgba(255,255,255,0.16);}
#assistantText{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(420px,calc(100vw - 32px));max-height:35vh;overflow:hidden;padding:10px 14px;border-radius:8px;background:rgba(18,20,24,0.78);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(0,0,0,0.28);color:white;font:18px/1.45 "Microsoft JhengHei",Segoe UI,sans-serif;white-space:pre-wrap;text-shadow:0 1px 2px rgba(0,0,0,0.65);z-index:140;opacity:0;pointer-events:none;transition:opacity .18s ease;}
#assistantText.visible{opacity:1;}
body.dragging{cursor:move;}
</style>
<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@3.0.0/lib/three-vrm-animation.module.js"
  }
}
</script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head><body>
<div id="hud"><span id="status">loading...</span></div>
<div id="close" title="Close">×</div>
<div id="vrmaMenu" role="menu"></div>
<div id="assistantText" aria-live="polite"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

window.onload = () => {
    if (typeof qt !== 'undefined') {
        new QWebChannel(qt.webChannelTransport, (channel) => {
            window.vrmHost = channel.objects.vrmHost;
            initApp();
        });
    }
};

function initApp() {
    const setStatus = (t) => {
        const el = document.getElementById('status');
        if (el) el.innerText = t;
    };
    document.getElementById('close').onclick = () => window.vrmHost.closeWindow();
    const vrmaMenu = document.getElementById('vrmaMenu');
    const assistantText = document.getElementById('assistantText');
    let assistantTextTimer = null;
    let vrmaFiles = [];

    const qs = new URLSearchParams(location.search);
    const file = qs.get('file') || 'charactor.vrm';

    const scene = new THREE.Scene();
    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);
    camera.position.set(0, 1.2, 6);
    camera.lookAt(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // Renderer settings from TEMP reference
    document.body.appendChild(renderer.domElement);

    // Lighting from TEMP reference: Hemisphere 2.4, Directional 1.8
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(1, 3, 4);
    scene.add(dirLight);

    const loader = new GLTFLoader();
    loader.register(parser => new VRMLoaderPlugin(parser));
    loader.register(parser => new VRMAnimationLoaderPlugin(parser));
    
    let currentVrm = null;
    let currentMixer = null;
    let currentAction = null;
    let currentAnimationName = '';
    let modelCenter = new THREE.Vector3(0, 1, 0);
    let modelSize = new THREE.Vector3(1, 1.7, 0.5);
    let userRotationY = 0;
    let userRotationX = 0;
    const dragLag = new THREE.Vector3();
    const dragVelocity = new THREE.Vector3();
    const baseModelPosition = new THREE.Vector3();

    // Zoom settings
    let zoomHeight = 600;

    // Mouse Tracking Smoother
    const mousePosFiltered = new THREE.Vector2(0, 0);
    const lookAtTarget = new THREE.Object3D();
    scene.add(lookAtTarget);

    function fitCameraAndWindow() {
        if (!currentVrm) return;
        currentVrm.scene.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(currentVrm.scene);
        box.getCenter(modelCenter);
        box.getSize(modelSize);

        const aspect = Math.max(0.35, Math.min(1.5, modelSize.x / Math.max(modelSize.y, 0.001)));
        const charH = zoomHeight;
        const charW = charH * aspect;

        // Window size with 0.1x padding (total 1.1x)
        const targetWidth = Math.round(charW * 1.1);
        const targetHeight = Math.round(charH * 1.1);
        window.vrmHost.fitWindowToModel(targetWidth, targetHeight);

        const pad = 1.1; 
        const viewH = Math.max(modelSize.y * pad, 0.1);
        const viewW = Math.max(modelSize.x * pad, 0.1);
        
        camera.left = -viewW / 2;
        camera.right = viewW / 2;
        camera.top = viewH / 2;
        camera.bottom = -viewH / 2;
        
        camera.position.set(modelCenter.x, modelCenter.y, modelCenter.z + 6);
        camera.lookAt(modelCenter);
        camera.updateProjectionMatrix();
    }

    function setBoneQuaternion(vrm_obj, name, arr) {
        if (['head', 'neck'].includes(name.toLowerCase())) return false;
        const bone = vrm_obj.humanoid?.getNormalizedBoneNode?.(name) || vrm_obj.humanoid?.getRawBoneNode?.(name);
        if (!bone || !Array.isArray(arr) || arr.length !== 4) return false;
        bone.quaternion.set(Number(arr[0]), Number(arr[1]), Number(arr[2]), Number(arr[3])).normalize();
        return true;
    }

    function stopVrmaAnimation(resetPose = false) {
        if (currentAction) {
            currentAction.stop();
            currentAction = null;
        }
        if (currentMixer) currentMixer.stopAllAction();
        currentAnimationName = '';
        if (resetPose && currentVrm?.humanoid) {
            const humanoid = currentVrm.humanoid;
            if (humanoid.resetNormalizedPose) humanoid.resetNormalizedPose();
            else if (humanoid.resetRawPose) humanoid.resetRawPose();
            else humanoid.resetPose?.();
        }
    }

    window.applyPoseData = (data) => {
        if (!currentVrm) return;
        stopVrmaAnimation(true);
        try {
            const poseData = (typeof data === 'string') ? JSON.parse(data) : data;
            const bones = poseData.data || poseData;
            for (const [boneName, value] of Object.entries(bones)) {
                setBoneQuaternion(currentVrm, boneName, value?.rotation);
            }
            currentVrm.humanoid?.update?.();
        } catch (e) { console.error('pose error:', e); }
    };

    async function readLocalBinary(filename) {
        const base64 = await window.vrmHost.readBinaryFile(filename);
        if (!base64) throw new Error(`${filename} not found`);
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
    }

    function patchVrmaSpecVersion(buffer) {
        const source = new Uint8Array(buffer);
        const view = new DataView(source.buffer, source.byteOffset, source.byteLength);
        const magic = view.getUint32(0, true);
        const version = view.getUint32(4, true);
        if (magic !== 0x46546c67 || version !== 2) return buffer;

        const textDecoder = new TextDecoder();
        const textEncoder = new TextEncoder();
        const chunks = [];
        let offset = 12;
        let changed = false;

        while (offset + 8 <= source.byteLength) {
            const chunkLength = view.getUint32(offset, true);
            const chunkType = view.getUint32(offset + 4, true);
            const chunkStart = offset + 8;
            const chunkEnd = chunkStart + chunkLength;
            let chunkData = source.slice(chunkStart, chunkEnd);

            if (chunkType === 0x4e4f534a) {
                const jsonText = textDecoder.decode(chunkData).trim();
                const json = JSON.parse(jsonText);
                const vrmaExtension = json.extensions?.VRMC_vrm_animation;
                if (vrmaExtension && !vrmaExtension.specVersion) {
                    vrmaExtension.specVersion = '1.0';
                    const encoded = textEncoder.encode(JSON.stringify(json));
                    const paddedLength = Math.ceil(encoded.byteLength / 4) * 4;
                    chunkData = new Uint8Array(paddedLength);
                    chunkData.fill(0x20);
                    chunkData.set(encoded);
                    changed = true;
                }
            }

            chunks.push({ type: chunkType, data: chunkData });
            offset = chunkEnd;
        }

        if (!changed) return buffer;

        const totalLength = 12 + chunks.reduce((sum, chunk) => sum + 8 + chunk.data.byteLength, 0);
        const result = new ArrayBuffer(totalLength);
        const out = new Uint8Array(result);
        const outView = new DataView(result);
        outView.setUint32(0, magic, true);
        outView.setUint32(4, version, true);
        outView.setUint32(8, totalLength, true);

        let outOffset = 12;
        for (const chunk of chunks) {
            outView.setUint32(outOffset, chunk.data.byteLength, true);
            outView.setUint32(outOffset + 4, chunk.type, true);
            out.set(chunk.data, outOffset + 8);
            outOffset += 8 + chunk.data.byteLength;
        }
        return result;
    }

    async function playVrma(filename) {
        if (!currentVrm || !currentMixer) return;
        hideVrmaMenu();
        setStatus(`loading ${filename}...`);
        try {
            stopVrmaAnimation(true);
            const buffer = patchVrmaSpecVersion(await readLocalBinary(filename));
            const gltf = await loader.parseAsync(buffer, '');
            const vrmAnimation = gltf.userData.vrmAnimations?.[0];
            if (!vrmAnimation) throw new Error('VRMA animation data missing');

            const clip = createVRMAnimationClip(vrmAnimation, currentVrm);
            currentAction = currentMixer.clipAction(clip);
            currentAction.setLoop(THREE.LoopOnce, 1);
            currentAction.clampWhenFinished = true;
            currentAction.reset().play();
            currentAnimationName = filename.split('/').pop().replace(/\.vrma$/i, '');
            setStatus(`${currentAnimationName} playing`);
        } catch (e) {
            console.error('vrma error:', e);
            setStatus(`failed: ${filename}`);
        }
    }

    window.playVrmaByName = (name) => {
        const cleanName = String(name || '').replace(/[^A-Za-z]/g, '');
        const match = vrmaFiles.find(item => item.label === cleanName);
        const path = match?.path || `VRMA/${cleanName}.vrma`;
        playVrma(path);
    };

    window.showAssistantText = (text) => {
        const value = String(text || '').trim();
        if (assistantTextTimer) {
            clearTimeout(assistantTextTimer);
            assistantTextTimer = null;
        }
        assistantText.textContent = value;
        assistantText.classList.toggle('visible', value.length > 0);
        if (value.length > 0) {
            const visibleMs = Math.min(14000, Math.max(4500, value.length * 180));
            assistantTextTimer = setTimeout(() => {
                assistantText.classList.remove('visible');
            }, visibleMs);
        }
    };

    function showVrmaMenu(x, y) {
        if (!currentVrm) return;
        if (!vrmaMenu.children.length) {
            setStatus('no VRMA files');
            return;
        }
        const margin = 6;
        vrmaMenu.classList.add('open');
        const rect = vrmaMenu.getBoundingClientRect();
        const left = Math.min(Math.max(margin, x), innerWidth - rect.width - margin);
        const top = Math.min(Math.max(margin, y), innerHeight - rect.height - margin);
        vrmaMenu.style.left = `${left}px`;
        vrmaMenu.style.top = `${top}px`;
    }

    function hideVrmaMenu() {
        vrmaMenu.classList.remove('open');
    }

    async function loadVrmaMenu() {
        try {
            const raw = await window.vrmHost.listVrmaFiles();
            vrmaFiles = JSON.parse(raw || '[]');
        } catch (e) {
            console.error('vrma menu error:', e);
            vrmaFiles = [];
        }

        vrmaMenu.innerHTML = '';
        for (const item of vrmaFiles) {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.vrma = item.path;
            button.textContent = item.label;
            vrmaMenu.appendChild(button);
        }
    }

    vrmaMenu.addEventListener('mousedown', (e) => e.stopPropagation());
    vrmaMenu.addEventListener('click', (e) => {
        const button = e.target.closest('button[data-vrma]');
        if (!button) return;
        playVrma(button.dataset.vrma);
    });

    async function loadVrm(url) {
        setStatus('loading...');
        try {
            const base64 = await window.vrmHost.readBinaryFile(url);
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const gltf = await loader.parseAsync(bytes.buffer, '');
            currentVrm = gltf.userData.vrm;
            modelRoot.add(currentVrm.scene);
            VRMUtils.rotateVRM0(currentVrm);
            currentMixer = new THREE.AnimationMixer(currentVrm.scene);
            
            if (currentVrm.lookAt) {
                currentVrm.lookAt.target = lookAtTarget;
            }

            fitCameraAndWindow();
            setStatus('ready');
            await window.vrmHost.updatePose('pose.json');
        } catch (e) {
            console.error('load error:', e);
            setStatus('failed');
        }
    }

    let leftDragging = false;
    let rightDragging = false;
    let rightDragMoved = false;
    let rightDragStart = null;
    let last = null;
    const mouseRaw = { x: 0, y: 0 };

    addEventListener('contextmenu', (e) => {
        e.preventDefault();
    });
    addEventListener('mousedown', (e) => {
        if (e.target?.id === 'close') return;
        hideVrmaMenu();
        if (e.button === 0) {
            leftDragging = true;
            document.body.classList.add('dragging');
        } else if (e.button === 2) {
            rightDragging = true;
            rightDragMoved = false;
            rightDragStart = { x: e.clientX, y: e.clientY };
        } else return;
        last = { x: e.screenX, y: e.screenY };
        e.preventDefault();
    });
    addEventListener('mousemove', (e) => {
        mouseRaw.x = (e.clientX / innerWidth) * 2 - 1;
        mouseRaw.y = (e.clientY / innerHeight) * 2 - 1;

        if (!last) return;
        const dx = e.screenX - last.x;
        const dy = e.screenY - last.y;
        if (leftDragging) {
            if (dx || dy) {
                window.vrmHost.dragWindowBy(dx, dy);
                dragVelocity.x += -dx * 0.0022;
                dragVelocity.y += dy * 0.0022;
            }
        } else if (rightDragging) {
            const movedX = e.clientX - rightDragStart.x;
            const movedY = e.clientY - rightDragStart.y;
            rightDragMoved = rightDragMoved || Math.hypot(movedX, movedY) > 4;
            if (rightDragMoved) {
                userRotationY += dx * 0.012;
                userRotationX += dy * 0.006;
                userRotationX = Math.max(-0.55, Math.min(0.55, userRotationX));
                modelRoot.rotation.set(userRotationX, userRotationY, 0);
            }
        }
        last = { x: e.screenX, y: e.screenY };
        e.preventDefault();
    });

    addEventListener('wheel', (e) => {
        const delta = e.deltaY;
        if (delta > 0) zoomHeight = Math.max(100, zoomHeight - 50);
        else zoomHeight = Math.min(2000, zoomHeight + 50);
        fitCameraAndWindow();
    });

    function stopDrag(e) {
        const shouldOpenMenu = e?.button === 2 && rightDragging && !rightDragMoved;
        if (shouldOpenMenu) showVrmaMenu(e.clientX, e.clientY);
        leftDragging = false;
        rightDragging = false;
        rightDragMoved = false;
        rightDragStart = null;
        last = null;
        document.body.classList.remove('dragging');
    }
    addEventListener('mouseup', stopDrag);
    addEventListener('mouseleave', stopDrag);
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitCameraAndWindow(); });
    addEventListener('dblclick', (e) => {
        if (e.button === 0 && window.vrmHost) window.vrmHost.triggerNextPose();
    });

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (currentMixer) currentMixer.update(dt);

        if (currentVrm) {
            mousePosFiltered.x = THREE.MathUtils.lerp(mousePosFiltered.x, mouseRaw.x, dt * 5);
            mousePosFiltered.y = THREE.MathUtils.lerp(mousePosFiltered.y, mouseRaw.y, dt * 5);

            const head = currentVrm.humanoid.getNormalizedBoneNode('head');
            if (head) {
                // INCREASED AMPLITUDE: maxYaw 0.8, maxPitch 0.5
                const maxYaw = 0.8;
                const maxPitch = 0.5;
                const yaw = mousePosFiltered.x * maxYaw;
                const pitch = -mousePosFiltered.y * maxPitch;
                head.rotation.set(pitch, yaw, 0);
            }
            
            if (currentVrm.lookAt) {
                const worldX = (mousePosFiltered.x * (camera.right - camera.left)) / 2 + camera.position.x;
                const worldY = (-(mousePosFiltered.y) * (camera.top - camera.bottom)) / 2 + camera.position.y;
                lookAtTarget.position.set(worldX, worldY, 2);
                currentVrm.lookAt.update(dt);
            }
        }

        const stiffness = leftDragging ? 30 : 22;
        const damping = leftDragging ? 5.2 : 4.2;
        dragVelocity.x += -dragLag.x * stiffness * dt;
        dragVelocity.y += -dragLag.y * stiffness * dt;
        dragVelocity.multiplyScalar(Math.max(0, 1 - damping * dt));
        dragLag.addScaledVector(dragVelocity, dt);
        modelRoot.position.copy(baseModelPosition).add(dragLag);
        
        if (currentVrm) currentVrm.update(dt);
        renderer.render(scene, camera);
    }
    animate();
    loadVrmaMenu();
    loadVrm(file).catch(e => { console.error(e); });
}
</script>
</body></html>
